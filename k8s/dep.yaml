# ==============================
# ConfigMap
# ==============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: springappconfigmap
data:
  username: springapp
  database: test
  hostname: mongo

---
# ==============================
# Secret
# ==============================
apiVersion: v1
kind: Secret
metadata:
  name: springappsecrets
type: Opaque
stringData:
  password: devdb@123

---
# ==============================
# Persistent Volume
# ==============================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-hostpath
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/tmp/mongodata"

---
# ==============================
# Persistent Volume Claim
# ==============================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-hostpath
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

---
# ==============================
# MongoDB Deployment
# ==============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      volumes:
        - name: mongodb-pvc
          persistentVolumeClaim:
            claimName: pvc-hostpath

      containers:
        - name: mongodb-container
          image: mongo:8.0.9-noble

          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: springappconfigmap
                  key: username

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: springappsecrets
                  key: password

          volumeMounts:
            - name: mongodb-pvc
              mountPath: /data/db

---
# ==============================
# MongoDB Service
# ==============================
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  type: ClusterIP
  selector:
    app: mongodb

  ports:
    - port: 27017
      targetPort: 27017

---
# ==============================
# Spring Boot Deployment
# ==============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springappdeployment
spec:
  replicas: 2

  selector:
    matchLabels:
      app: springapp

  template:
    metadata:
      labels:
        app: springapp

    spec:
      containers:
        - name: springappcontainer
          image: kkeducation12345/spring-app:1.0.0

          ports:
            - containerPort: 8080

          env:
            - name: MONGO_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: springappconfigmap
                  key: username

            - name: MONGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: springappsecrets
                  key: password

            - name: MONGO_DB_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: springappconfigmap
                  key: hostname

            - name: MONGO_DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: springappconfigmap
                  key: database

---
# ==============================
# Spring Boot Service
# ==============================
apiVersion: v1
kind: Service
metadata:
  name: springapp
spec:
  type: NodePort

  selector:
    app: springapp

  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
